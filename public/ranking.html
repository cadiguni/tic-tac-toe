<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking - Jogo da Velha</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 3em;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .stat-number {
      font-size: 2.5em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .stat-label {
      font-size: 1.1em;
      opacity: 0.8;
    }

    .ranking-list {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      margin-bottom: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      transition: all 0.3s ease;
    }

    .ranking-item:hover {
      background: rgba(255,255,255,0.1);
      transform: translateX(5px);
    }

    .ranking-item:first-child {
      background: linear-gradient(45deg, #ffd700, #ffed4e);
      color: #333;
      font-weight: bold;
      transform: scale(1.02);
    }

    .ranking-item:nth-child(2) {
      background: linear-gradient(45deg, #c0c0c0, #e8e8e8);
      color: #333;
    }

    .ranking-item:nth-child(3) {
      background: linear-gradient(45deg, #cd7f32, #daa520);
      color: white;
    }

    .position {
      font-size: 1.5em;
      font-weight: bold;
      min-width: 60px;
    }

    .player-name {
      flex: 1;
      font-size: 1.2em;
      text-align: left;
      margin-left: 20px;
    }

    .victories {
      font-size: 1.1em;
      font-weight: bold;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2em;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      opacity: 0.7;
    }

    .refresh-btn {
      background: linear-gradient(45deg, #4CAF50, #45a049);
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      margin: 20px auto;
      display: block;
      transition: all 0.3s ease;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <a href="/" class="back-btn">← Voltar</a>
  
  <div class="container">
    <h1>🏆 Ranking Global</h1>
    
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="total-partidas">-</div>
        <div class="stat-label">Total de Partidas</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="partidas-hoje">-</div>
        <div class="stat-label">Partidas Hoje</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="duracao-media">-</div>
        <div class="stat-label">Duração Média</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="salas-ativas">-</div>
        <div class="stat-label">Salas Ativas</div>
      </div>
    </div>

    <div class="ranking-list">
      <h2 style="text-align: center; margin-bottom: 30px;">🎮 Melhores Jogadores</h2>
      <button class="refresh-btn" onclick="carregarDados()">🔄 Atualizar</button>
      <div id="ranking-content">
        <div class="loading">Carregando ranking...</div>
      </div>
    </div>
  </div>

  <script>
    async function carregarDados() {
      try {
        // Carregar ranking
        const rankingResponse = await fetch('/ranking');
        const ranking = await rankingResponse.json();
        
        // Carregar estatísticas
        const statsResponse = await fetch('/estatisticas');
        const stats = await statsResponse.json();
        
        // Atualizar estatísticas
        document.getElementById('total-partidas').textContent = stats.totalPartidas || 0;
        document.getElementById('partidas-hoje').textContent = stats.partidasHoje || 0;
        document.getElementById('duracao-media').textContent = 
          stats.duracaoMediaSegundos ? `${Math.round(stats.duracaoMediaSegundos)}s` : '-';
        document.getElementById('salas-ativas').textContent = stats.salasAtivas || 0;
        
        // Atualizar ranking
        const rankingContent = document.getElementById('ranking-content');
        
        if (ranking.length === 0) {
          rankingContent.innerHTML = `
            <div class="empty-state">
              <h3>🎭 Nenhuma partida registrada ainda!</h3>
              <p>Seja o primeiro a aparecer no ranking!</p>
              <a href="/nova-sala" style="color: #4CAF50; text-decoration: none; font-weight: bold;">
                🚀 Começar a jogar
              </a>
            </div>
          `;
        } else {
          rankingContent.innerHTML = ranking.map((player, index) => {
            const position = index + 1;
            let emoji = '';
            
            if (position === 1) emoji = '🥇';
            else if (position === 2) emoji = '🥈';
            else if (position === 3) emoji = '🥉';
            else emoji = `${position}º`;
            
            return `
              <div class="ranking-item">
                <div class="position">${emoji}</div>
                <div class="player-name">${player._id}</div>
                <div class="victories">${player.vitorias} vitória${player.vitorias !== 1 ? 's' : ''}</div>
              </div>
            `;
          }).join('');
        }
        
      } catch (error) {
        console.error('Erro ao carregar dados:', error);
        document.getElementById('ranking-content').innerHTML = `
          <div class="empty-state">
            <h3>❌ Erro ao carregar ranking</h3>
            <p>Tente novamente em alguns segundos.</p>
          </div>
        `;
      }
    }
    
    // Carregar dados ao abrir a página
    carregarDados();
    
    // Atualizar a cada 30 segundos
    setInterval(carregarDados, 30000);
  </script>
</body>
</html>
