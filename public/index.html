<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Tela de entrada: substitui os prompts de nome/sala -->
  <div id="entrada-overlay" class="overlay">
    <div class="overlay-caixa">
      <h2>🎮 Entrar na sala</h2>
      <p id="entrada-sala" class="overlay-sub"></p>

      <!-- Já logado -->
      <div id="entrada-logado" hidden>
        <p class="overlay-conta">Conectado como <strong id="entrada-nome-conta"></strong> ✓</p>
        <button id="entrada-jogar-conta" class="btn btn-primary">Jogar</button>
        <button id="entrada-sair" class="auth-link">Sair da conta</button>
      </div>

      <!-- Convidado -->
      <div id="entrada-convidado" hidden>
        <label class="overlay-label" for="entrada-nome">Seu nome</label>
        <input type="text" id="entrada-nome" maxlength="20" placeholder="Como quer ser chamado?" autocomplete="nickname">
        <button id="entrada-jogar-convidado" class="btn btn-primary">Jogar como convidado</button>
        <p id="entrada-erro" class="auth-erro" hidden></p>

        <div class="overlay-divisor"><span>ou</span></div>

        <p class="overlay-nota">Contas aparecem no ranking. Convidados não.</p>
        <div id="entrada-auth"></div>
      </div>
    </div>
  </div>

  <div class="game-container">
    <h1>🎮 Jogo da Velha</h1>

    <!-- Modo de jogo da sala -->
    <div id="modo-info">
      <span id="modo-badge" class="modo-badge">🎯 Clássico</span>
      <span id="modo-dica"></span>
    </div>

    <!-- Status do jogo -->
    <div id="game-status">
      <div id="player-info">
        <span id="meu-simbolo"></span>
        <span id="conexao-status">🔗 Conectando...</span>
      </div>
      <div id="turno-info">
        <span id="turno-atual">Aguardando jogadores...</span>
      </div>
      <div id="sala-info">
        <span id="sala-id"></span>
        <button id="copiar-link" title="Copiar link da sala">📋</button>
      </div>
    </div>
  <div class="tabuleiro">
    <div class="celula" data-pos="0"></div>
    <div class="celula" data-pos="1"></div>
    <div class="celula" data-pos="2"></div>
    <div class="celula" data-pos="3"></div>
    <div class="celula" data-pos="4"></div>
    <div class="celula" data-pos="5"></div>
    <div class="celula" data-pos="6"></div>
    <div class="celula" data-pos="7"></div>
    <div class="celula" data-pos="8"></div>
  </div>

  <div id="controle-inicio">
    <button id="comecaX">❌ X começa</button>
    <button id="comecaO">⭕ O começa</button>
    <button id="reiniciar">🔄 Reiniciar Jogo</button>
  </div>

  <!-- Seção de jogadores -->
  <div id="jogadores-online">
    <h3>👥 Jogadores na Sala</h3>
    <div id="lista-jogadores"></div>
  </div>
  <!-- Chat -->
  <div id="chat-section">
    <h3>💬 Chat</h3>
    <div id="mensagens"></div>
    <div id="chat-input">
      <input type="text" id="mensagemInput" placeholder="Digite uma mensagem...">
      <button id="enviarMensagem">📤</button>
    </div>
  </div>

  <!-- Ranking -->
  <div id="ranking-section">
    <h3>🏆 Ranking Global</h3>
    <ul id="ranking"></ul>
  </div>

  <!-- Histórico -->
  <div id="historico-section">
    <h3>📜 Histórico de Partidas</h3>
    <div id="historico-lista"></div>
  </div>

  </div> <!-- game-container -->

  <script src="/socket.io/socket.io.js"></script>
  <script src="/auth.js"></script>
  <script src="/script.js"></script>
</body>
</html>
