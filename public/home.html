<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha - Home</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 500px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 1.2em;
      margin-bottom: 40px;
      opacity: 0.9;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
    }

    .btn-primary {
      background: linear-gradient(45deg, #4CAF50, #45a049);
      color: white;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .input-group {
      margin: 20px 0;
    }

    .input-group input {
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1em;
      width: 200px;
      text-align: center;
    }

    .input-group input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .stats {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.2);
      font-size: 0.9em;
      opacity: 0.8;
    }

    .modos {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .modo-card {
      flex: 1;
      cursor: pointer;
      padding: 14px 10px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      transition: all 0.25s ease;
      text-align: center;
    }

    .modo-card:hover {
      background: rgba(255,255,255,0.16);
    }

    .modo-card input {
      display: none;
    }

    .modo-card.ativo {
      border-color: #4CAF50;
      background: rgba(76,175,80,0.22);
      transform: translateY(-2px);
    }

    .modo-card .titulo {
      font-weight: bold;
      font-size: 1.05em;
      display: block;
      margin-bottom: 6px;
    }

    .modo-card .descricao {
      font-size: 0.75em;
      opacity: 0.85;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Jogo da Velha</h1>
    <p class="subtitle">Jogue online com seus amigos!</p>
    
    <div class="modos">
      <label class="modo-card ativo">
        <input type="radio" name="modo" value="classico" checked>
        <span class="titulo">🎯 Clássico</span>
        <span class="descricao">Regras de sempre. As marcas ficam no tabuleiro e pode dar velha.</span>
      </label>

      <label class="modo-card">
        <input type="radio" name="modo" value="infinito">
        <span class="titulo">♾️ Infinito</span>
        <span class="descricao">Cada jogador só mantém 3 marcas. A 4ª faz a mais antiga sumir — nunca dá velha.</span>
      </label>
    </div>

    <div class="buttons">
      <a href="/nova-sala?modo=classico" id="criarSalaBtn" class="btn btn-primary">
        🚀 Criar Nova Sala
      </a>

      <div class="input-group">
        <input type="text" id="salaInput" placeholder="Nome da sala..." maxlength="20">
        <br><br>
        <button onclick="entrarSala()" class="btn btn-secondary">
          🏠 Entrar em Sala
        </button>
      </div>
      
      <a href="/ranking" class="btn btn-secondary">
        🏆 Ver Ranking
      </a>
      
      <a href="/estatisticas" class="btn btn-secondary">
        📊 Estatísticas
      </a>
    </div>
    
    <div class="stats">
      <p>💡 <strong>Dica:</strong> Compartilhe o link da sala para convidar amigos!</p>
    </div>
  </div>

  <script>
    const criarSalaBtn = document.getElementById('criarSalaBtn');

    function modoSelecionado() {
      return document.querySelector('input[name="modo"]:checked').value;
    }

    // Destaque visual do cartão + link de criação sempre no modo escolhido
    document.querySelectorAll('.modo-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.modo-card').forEach(c => c.classList.remove('ativo'));
        card.classList.add('ativo');
        criarSalaBtn.href = `/nova-sala?modo=${modoSelecionado()}`;
      });
    });

    function entrarSala() {
      const sala = document.getElementById('salaInput').value.trim();

      if (!sala) {
        alert('Digite o nome da sala!');
        return;
      }

      // O modo só é aplicado se a sala ainda não existir; caso contrário vale o
      // modo com que ela foi criada.
      window.location.href = `/sala/${encodeURIComponent(sala)}?modo=${modoSelecionado()}`;
    }

    document.getElementById('salaInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        entrarSala();
      }
    });
  </script>
</body>
</html>
